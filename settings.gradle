pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        mavenLocal()
        maven { url "https://api.xposed.info/" }
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "Smartspacer"
include ':app'
include ':systemstubs'
include ':sdk-core'
include ':sdk-sample'
include ':sdk-plugin'
include ':sdk-client'
include ':launcherclient'
include ':proto'
